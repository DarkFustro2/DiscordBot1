<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>DarkFustro Bot Aktif Edici</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        input { padding: 10px; width: 350px; border-radius: 5px; border: none; margin-bottom: 10px; }
        button { padding: 10px 25px; background: #5865F2; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #durum { margin-top: 20px; color: #00ff88; }
    </style>
</head>
<body>
    <h2>DarkFustro Discord Bot</h2>
    <input type="password" id="token" placeholder="Yeni Bot Tokenini Buraya Yapıştır">
    <button onclick="baslat()">Botu Aktif Et</button>
    <div id="durum">Bekleniyor...</div>

    <script>
        function baslat() {
            const token = document.getElementById('token').value;
            const durum = document.getElementById('durum');
            if (!token) return alert("Token gir!");

            durum.innerText = "Discord'a bağlanılıyor...";
            const ws = new WebSocket("wss://gateway.discord.gg/?v=10&encoding=json");

            ws.onopen = () => {
                durum.innerText = "Bağlantı kuruldu, giriş yapılıyor...";
            };

            ws.onmessage = (event) => {
                const payload = JSON.parse(event.data);
                const { op, d } = payload;

                if (op === 10) {
                    const interval = d.heartbeat_interval;
                    setInterval(() => {
                        ws.send(JSON.stringify({ op: 1, d: null }));
                    }, interval);

                    ws.send(JSON.stringify({
                        op: 2,
                        d: {
                            token: token,
                            intents: 513,
                            properties: { os: "windows", browser: "chrome", device: "pc" },
                            presence: {
                                activities: [{ name: "DarkFustro YouTube", type: 0 }],
                                status: "online",
                                afk: false
                            }
                        }
                    }));
                }

                if (payload.t === "READY") {
                    durum.innerText = `AKTİF! (${d.user.username} şu an çevrimiçi)`;
                }
            };

            ws.onerror = () => {
                durum.style.color = "#ff4444";
                durum.innerText = "Hata! VPN/Proxy açık olduğundan ve tokenin doğru olduğundan emin ol.";
            };
        }
    </script>
</body>
</html>
